project:
  type: website
  title: "QuestionSafe"
  output-dir: ../_site
  preview:
    port: 4200
    browser: true

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    grid:
      body-width: 900px
    css: styles.css

execute:
  kernel: questionsafe-uv
  echo: true
  warning: false
  error: false

website:
  repo-url: https://github.com/kenjisato/questionsafe
  repo-actions: [edit, issue]
  sidebar:
    contents:
      - text: Home
        file: index.qmd
      - text: Quickstart
        file: quickstart.qmd
      - text: Python API
        file: python.qmd
      - text: MetaChoice
        file: metachoice.qmd
      - text: Markdown Schema
        file: markdown.qmd
      - text: Usage
        file: usage.qmd
      - text: API Reference
        file: api/index.qmd
      - text: API Overview
        file: api-overview.md
      - text: Moodle Compatibility
        file: moodle-compat.md
      - text: References
        file: references.md
      - text: Roadmap
        file: roadmap.md
      - text: Changelog
        file: CHANGELOG.md
    tools:
      - icon: github
        href: https://github.com/kenjisato/questionsafe

quartodoc:
  package: questionsafe
  style: pkgdown
  parser: google

metadata-files:
  - _quartodoc.yml

